# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["staging" ]
  pull_request:
    branches: ["staging"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      pull-requests: write # for commenting on PRs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This is where you will need to introduce the Snyk API token created with your Snyk account
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Runs Snyk Open Source (SCA) test for vulnerabilities in dependencies
      - name: Snyk Open Source test
        id: snyk-test
        run: |
          snyk test --json > snyk-test-results.json 2>&1 || true
          if [ -f snyk-test-results.json ] && [ -s snyk-test-results.json ]; then
            snyk test --sarif > snyk-opensource.sarif 2>/dev/null || true
          fi
        continue-on-error: true

      # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
      # Note: Snyk Code requires activation in your Snyk organization settings
      - name: Snyk Code test
        id: snyk-code
        run: |
          snyk code test --json > snyk-code-results.json 2>&1 || true
          if [ -f snyk-code-results.json ] && [ -s snyk-code-results.json ]; then
            snyk code test --sarif > snyk-code.sarif 2>/dev/null || true
          fi
        continue-on-error: true

      # Monitors dependencies for ongoing vulnerability tracking
      - name: Snyk Open Source monitor
        run: snyk monitor || true
        continue-on-error: true

      # Install snyk-to-html for generating HTML reports
      - name: Install snyk-to-html
        run: npm install -g snyk-to-html

      # Generate HTML report for vulnerabilities
      - name: Generate HTML Report - Vulnerabilities
        if: always()
        run: |
          if [ -f snyk-test-results.json ] && [ -s snyk-test-results.json ]; then
            snyk-to-html -i snyk-test-results.json -o snyk-vulnerabilities-report.html || echo "No vulnerabilities report generated"
          else
            echo "<html><body><h1>No vulnerability scan results available</h1></body></html>" > snyk-vulnerabilities-report.html
          fi

      # Generate HTML report for code issues
      - name: Generate HTML Report - Code Issues
        if: always()
        run: |
          if [ -f snyk-code-results.json ] && [ -s snyk-code-results.json ]; then
            snyk-to-html -i snyk-code-results.json -o snyk-code-report.html || echo "No code report generated"
          else
            echo "<html><body><h1>No code scan results available</h1></body></html>" > snyk-code-report.html
          fi

      # Parse results and create summary
      - name: Parse Results and Create Summary
        if: always()
        id: parse-results
        run: |
          echo "## 🔒 Snyk Security Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Initialize counters
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0

          # Parse vulnerabilities
          if [ -f snyk-test-results.json ] && [ -s snyk-test-results.json ]; then
            if jq -e '.vulnerabilities' snyk-test-results.json > /dev/null 2>&1; then
              CRITICAL=$(jq '[.vulnerabilities[]? | select(.severity=="critical")] | length' snyk-test-results.json 2>/dev/null || echo "0")
              HIGH=$(jq '[.vulnerabilities[]? | select(.severity=="high")] | length' snyk-test-results.json 2>/dev/null || echo "0")
              MEDIUM=$(jq '[.vulnerabilities[]? | select(.severity=="medium")] | length' snyk-test-results.json 2>/dev/null || echo "0")
              LOW=$(jq '[.vulnerabilities[]? | select(.severity=="low")] | length' snyk-test-results.json 2>/dev/null || echo "0")
            fi
          fi

          echo "### 🛡️ Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          # Parse code issues
          CODE_HIGH=0
          CODE_MEDIUM=0
          CODE_LOW=0

          if [ -f snyk-code-results.json ] && [ -s snyk-code-results.json ]; then
            if jq -e '.runs[0].results' snyk-code-results.json > /dev/null 2>&1; then
              CODE_HIGH=$(jq '[.runs[0].results[]? | select(.level=="error")] | length' snyk-code-results.json 2>/dev/null || echo "0")
              CODE_MEDIUM=$(jq '[.runs[0].results[]? | select(.level=="warning")] | length' snyk-code-results.json 2>/dev/null || echo "0")
              CODE_LOW=$(jq '[.runs[0].results[]? | select(.level=="note")] | length' snyk-code-results.json 2>/dev/null || echo "0")
            fi
          fi

          echo "### 🔐 Code Security Issues (SAST)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Error | $CODE_HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 Warning | $CODE_MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Note | $CODE_LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "code_high=$CODE_HIGH" >> $GITHUB_OUTPUT
          echo "code_medium=$CODE_MEDIUM" >> $GITHUB_OUTPUT
          echo "code_low=$CODE_LOW" >> $GITHUB_OUTPUT

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Detailed Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **HTML reports available in artifacts:**" >> $GITHUB_STEP_SUMMARY
          echo "- [Download reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **See also:**" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Security Tab](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      # Upload HTML reports as artifacts
      - name: Upload HTML Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-reports-${{ github.run_number }}
          path: |
            snyk-vulnerabilities-report.html
            snyk-code-report.html
            snyk-test-results.json
            snyk-code-results.json
            snyk-opensource.sarif
            snyk-code.sarif
          retention-days: 30
          if-no-files-found: warn

      # Upload Snyk Open Source results to GitHub Security
      - name: Upload Snyk Open Source results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-opensource.sarif
          category: snyk-opensource

      # Upload Snyk Code results to GitHub Security
      - name: Upload Snyk Code results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # Comment on PR with results and download links
      - name: Comment on PR with Results
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const critical = '${{ steps.parse-results.outputs.critical }}' || '0';
            const high = '${{ steps.parse-results.outputs.high }}' || '0';
            const medium = '${{ steps.parse-results.outputs.medium }}' || '0';
            const low = '${{ steps.parse-results.outputs.low }}' || '0';

            const codeHigh = '${{ steps.parse-results.outputs.code_high }}' || '0';
            const codeMedium = '${{ steps.parse-results.outputs.code_medium }}' || '0';
            const codeLow = '${{ steps.parse-results.outputs.code_low }}' || '0';

            let comment = '## 🔒 Snyk Security Analysis\n\n';

            // Vulnerabilities
            comment += '### 🛡️ Dependency Vulnerabilities\n\n';
            comment += '| Severity | Count |\n';
            comment += '|----------|-------|\n';
            comment += `| 🔴 Critical | ${critical} |\n`;
            comment += `| 🟠 High | ${high} |\n`;
            comment += `| 🟡 Medium | ${medium} |\n`;
            comment += `| 🟢 Low | ${low} |\n\n`;

            if (parseInt(critical) > 0 || parseInt(high) > 0) {
              comment += '⚠️ **Action Required:** Critical or High vulnerabilities detected!\n\n';
            }

            // Code Issues
            comment += '### 🔐 Code Security Issues (SAST)\n\n';
            comment += '| Severity | Count |\n';
            comment += '|----------|-------|\n';
            comment += `| 🔴 Error | ${codeHigh} |\n`;
            comment += `| 🟠 Warning | ${codeMedium} |\n`;
            comment += `| 🟡 Note | ${codeLow} |\n\n`;

            comment += '---\n\n';
            comment += '### 📊 Detailed Reports\n\n';
            comment += '📄 **HTML reports available:**\n';
            comment += `- [📥 Download reports (artifacts)](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `  - \`snyk-vulnerabilities-report.html\` - Dependency vulnerabilities\n`;
            comment += `  - \`snyk-code-report.html\` - Code security issues\n\n`;
            comment += '🔍 **Other resources:**\n';
            comment += `- [GitHub Security Tab](https://github.com/${{ github.repository }}/security/code-scanning)\n`;
            comment += `- [Workflow Run Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
            comment += `📅 **Scan Date:** ${new Date().toISOString()}\n\n`;
            comment += '*Automated security scan by Snyk*';

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Failed to create comment:', error.message);
            }
