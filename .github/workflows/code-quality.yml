name: Code Quality

on:
  pull_request:
    branches: [staging]
    paths:
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - 'package*.json'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'tsconfig.json'
      - '.github/workflows/code-quality.yml'

# Prevent duplicate runs on the same PR
concurrency:
  group: code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier Check
        run: npm run format:check
        continue-on-error: true

      - name: Run TypeScript Check
        run: npm run typecheck
        continue-on-error: true

      - name: Run Tests
        run: npm run test
        continue-on-error: true