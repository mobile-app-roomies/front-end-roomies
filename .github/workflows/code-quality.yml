name: Code Quality

on:
  pull_request:
    branches: ['**']
    paths:
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - 'package*.json'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'tsconfig.json'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Quality Checks
        run: |
          npm run lint || echo "::warning::ESLint issues found"
          npm run format:check || echo "::warning::Formatting issues found"
          npm run typecheck || echo "::warning::TypeScript issues found"

      - name: Run tests
        run: npm run test