name: Auto PR to Staging

on:
  push:
    branches-ignore: [main, staging]

permissions:
  contents: read
  pull-requests: write

# Prevent multiple concurrent PR creations for the same branch
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip merge commits and bot commits
    if: |
      !contains(github.event.head_commit.message, 'Merge') &&
      github.event.head_commit.author.name != 'GitHub'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Update PR
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}

          # Check existing PR
          EXISTING=$(gh pr list --head "$BRANCH" --base staging --json number -q '.[0].number' || echo "")

          if [ -z "$EXISTING" ]; then
            # Create new PR
            gh pr create \
              --title "🚀 $BRANCH → staging" \
              --body "## Auto Pull Request

              **Branch:** \`$BRANCH\` → \`staging\`
              **Commit:** ${{ github.sha }}

              ---
              *Auto-generated by GitHub Actions*" \
              --base staging \
              --head "$BRANCH"

            # Add labels
            PR_NUM=$(gh pr list --head "$BRANCH" --base staging --json number -q '.[0].number')

            if [[ "$BRANCH" =~ ^feat/ ]]; then
              gh pr edit "$PR_NUM" --add-label "feature" || true
            elif [[ "$BRANCH" =~ ^fix/ ]]; then
              gh pr edit "$PR_NUM" --add-label "bugfix" || true
            fi

            gh pr edit "$PR_NUM" --add-label "auto-pr" || true

            echo "✅ PR #$PR_NUM created"
          else
            echo "ℹ️ PR #$EXISTING already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}