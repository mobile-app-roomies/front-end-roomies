name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Analyze Code with ESLint
        run: |
          npx eslint . --format=json --output-file=eslint-results.json || true
        continue-on-error: true

      - name: Check TypeScript Types
        run: |
          npx tsc --noEmit --skipLibCheck > typescript-results.txt 2>&1 || true
        continue-on-error: true

      - name: Extract Pull Request Changes
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt

      - name: Generate AI Code Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require('fs');

            // Read files
            let prDiff = '';
            let eslintResults = [];
            let tsErrors = '';

            try {
              prDiff = fs.readFileSync('pr-diff.txt', 'utf8');
              if (fs.existsSync('eslint-results.json')) {
                eslintResults = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
              }
              if (fs.existsSync('typescript-results.txt')) {
                tsErrors = fs.readFileSync('typescript-results.txt', 'utf8');
              }
            } catch (error) {
              console.log('Error reading files:', error.message);
            }

            // Analyze ESLint results
            const totalErrors = eslintResults.reduce((sum, file) => sum + file.errorCount, 0);
            const totalWarnings = eslintResults.reduce((sum, file) => sum + file.warningCount, 0);

            // Get critical issues
            const criticalIssues = eslintResults.flatMap(file =>
              file.messages.filter(msg => msg.severity === 2)
            ).slice(0, 5);

            // Call OpenAI API for advanced review
            let aiReview = '';
            if (process.env.OPENAI_API_KEY && prDiff.length > 0) {
              try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [{
                      role: 'system',
                      content: `Tu es un expert en React Native et Expo. Analyse ce code diff et fournis une review constructive en français.
                      Focus sur:
                      - Performance React Native
                      - Sécurité
                      - Best practices Expo
                      - Optimisations possibles
                      - Bugs potentiels
                      Sois concis et constructif.`
                    }, {
                      role: 'user',
                      content: `Voici le diff de la PR:\n\n${prDiff.slice(0, 6000)}`
                    }],
                    max_tokens: 1000,
                    temperature: 0.3
                  })
                });

                if (response.ok) {
                  const data = await response.json();
                  aiReview = data.choices[0]?.message?.content || '';
                }
              } catch (error) {
                console.log('OpenAI API error:', error.message);
                aiReview = 'Analyse IA temporairement indisponible.';
              }
            }

            // Create comprehensive review comment
            const reviewComment = `## 🤖 Review IA Automatique

            ${aiReview ? `### 🧠 Analyse IA (GPT-4)
            ${aiReview}

            ` : ''}### 📊 Analyse Statique

            - **ESLint Erreurs**: ${totalErrors}
            - **ESLint Warnings**: ${totalWarnings}
            - **TypeScript**: ${tsErrors.includes('error') ? '❌ Erreurs détectées' : '✅ Pas d\'erreurs'}

            ${criticalIssues.length > 0 ? `### ⚠️ Problèmes Critiques
            ${criticalIssues.map(issue =>
              `- **${issue.ruleId}**: ${issue.message} (ligne ${issue.line})`
            ).join('\n')}
            ` : '### ✅ Aucun problème critique détecté'}

            ### 📱 Checklist React Native/Expo
            - ✅ Compilation TypeScript vérifiée
            - ✅ Règles ESLint appliquées
            - ${aiReview ? '✅' : '⚠️'} Analyse IA ${aiReview ? 'complétée' : 'limitée'}

            ### 🔗 Ressources
            - [Documentation Expo](https://docs.expo.dev/)
            - [React Native Performance](https://reactnative.dev/docs/performance)
            - [TypeScript Best Practices](https://typescript-eslint.io/rules/)

            ---
            *Review automatique générée par OpenAI GPT-4 & GitHub Actions*`;

            // Post the comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewComment
            });

            // Add relevant labels
            const labels = ['ai-review'];
            if (totalErrors > 0) labels.push('needs-fixes');
            if (totalWarnings > 5) labels.push('code-quality');
            if (aiReview.toLowerCase().includes('performance')) labels.push('performance');
            if (aiReview.toLowerCase().includes('sécurité')) labels.push('security');

            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            } catch (error) {
              console.log('Could not add labels:', error.message);
            }
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}