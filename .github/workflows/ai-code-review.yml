name: 🤖 AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'

# Prevent concurrent reviews on the same PR
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check Changes Size
        id: check
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          LINES=$(git diff --numstat origin/${{ github.event.pull_request.base.ref }}...HEAD | awk '{sum+=$1+$2} END {print sum}')

          if [ "$LINES" -gt 500 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ PR too large for AI review ($LINES lines)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ PR size OK for review ($LINES lines)"
          fi

      - name: AI Review
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: "diff" }
            });

            const maxDiff = 3000;
            const truncated = diff.data.length > maxDiff
              ? diff.data.substring(0, maxDiff) + '\n...(truncated)'
              : diff.data;

            const prompt = `Review this React Native/Expo PR concisely:

            **Focus on:**
            - 🐛 Bugs
            - 🔒 Security
            - ⚡ Performance
            - 📱 React Native best practices

            **Diff:**
            \`\`\`diff
            ${truncated}
            \`\`\`

            Be brief and constructive. Max 500 words.`;

            try {
              const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'gpt-3.5-turbo',  // Cheaper model
                  messages: [
                    { role: 'system', content: 'You are a React Native expert. Be concise.' },
                    { role: 'user', content: prompt }
                  ],
                  max_tokens: 800,
                  temperature: 0.3
                })
              });

              const data = await response.json();
              const review = data.choices[0]?.message?.content || 'No review generated';

              // Calculate cost (GPT-3.5: $0.50/1M input, $1.50/1M output)
              const cost = (data.usage.prompt_tokens / 1000000) * 0.50 +
                          (data.usage.completion_tokens / 1000000) * 1.50;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Review

              ${review}

              ---
              *GPT-3.5 • ${data.usage.total_tokens} tokens • $${cost.toFixed(4)}*`
              });

            } catch (error) {
              console.error('AI Review failed:', error);
            }
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}