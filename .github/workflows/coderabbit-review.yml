name: CodeRabbit AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coderabbit-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with annotations
        run: |
          npx eslint . --format=json --output-file=eslint-results.json || true
        continue-on-error: true

      - name: Run TypeScript type checking
        run: |
          npx tsc --noEmit --skipLibCheck || true
        continue-on-error: true

      - name: CodeRabbit Review
        uses: coderabbitai/coderabbit-action@v2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          # Optional: Custom configuration
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Add review summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read ESLint results if available
            let eslintSummary = '';
            try {
              if (fs.existsSync('eslint-results.json')) {
                const eslintResults = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
                const totalErrors = eslintResults.reduce((sum, file) => sum + file.errorCount, 0);
                const totalWarnings = eslintResults.reduce((sum, file) => sum + file.warningCount, 0);

                eslintSummary = `
            ## 🔍 Code Quality Analysis

            - **ESLint Errors**: ${totalErrors}
            - **ESLint Warnings**: ${totalWarnings}
                `;
              }
            } catch (error) {
              console.log('Could not read ESLint results:', error.message);
            }

            const comment = `## 🤖 AI Code Review Summary

            Cette Pull Request a été analysée automatiquement par CodeRabbit AI.

            ${eslintSummary}

            ### 📱 React Native/Expo Checks
            - ✅ TypeScript compilation vérifiée
            - ✅ ESLint rules appliquées
            - ✅ Code quality analysée par IA

            ### 🔗 Liens utiles
            - [Documentation Expo](https://docs.expo.dev/)
            - [React Native Best Practices](https://reactnative.dev/docs/performance)

            ---
            *Review automatique générée par CodeRabbit AI & GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });