name: 🔒 Snyk Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, staging]
    paths-ignore: ['**.md', 'docs/**', '.github/**', '*.txt']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          if echo "$CHANGED" | grep -qE "\.(js|jsx|ts|tsx|json|lock|yaml|yml)$"; then
            echo "scan_needed=true" >> $GITHUB_OUTPUT
            echo "✅ Security scan needed"
          else
            echo "scan_needed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No security-relevant changes"
          fi

      - name: 🔧 Setup
        if: steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install deps
        if: steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: 🔍 Setup Snyk
        if: steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch'
        uses: snyk/actions/setup@master

      - name: 🛡️ Run Security Scans
        if: steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch'
        id: scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Dependencies scan
          snyk test --json > deps.json 2>&1 || echo "DEPS_FAIL=$?" >> $GITHUB_ENV
          snyk test --sarif-file-output=deps.sarif 2>/dev/null || true

          # Code scan
          snyk code test --json > code.json 2>&1 || echo "CODE_FAIL=$?" >> $GITHUB_ENV
          snyk code test --sarif-file-output=code.sarif 2>/dev/null || true

          # Parse results
          CRITICAL=$(jq '[.vulnerabilities[]? | select(.severity=="critical")] | length' deps.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.vulnerabilities[]? | select(.severity=="high")] | length' deps.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.vulnerabilities[]? | select(.severity=="medium")] | length' deps.json 2>/dev/null || echo 0)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

          # Monitor on main branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            snyk monitor --all-projects || true
          fi

      - name: 📊 Generate Report
        if: always() && (steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch')
        run: |
          npm i -g snyk-to-html
          [ -f deps.json ] && snyk-to-html -i deps.json -o deps-report.html || true
          [ -f code.json ] && snyk-to-html -i code.json -o code-report.html || true

          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.scan.outputs.critical || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.scan.outputs.high || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | ${{ steps.scan.outputs.medium || 0 }} |" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload SARIF
        if: always() && (steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '*.sarif'
          category: snyk

      - name: 📤 Save Reports
        if: always() && (steps.changes.outputs.scan_needed != 'false' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            *-report.html
            *.json
          retention-days: 30

      - name: 💬 PR Comment
        if: github.event_name == 'pull_request' && steps.scan.outputs.critical
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const c = ${{ steps.scan.outputs.critical || 0 }};
            const h = ${{ steps.scan.outputs.high || 0 }};
            const m = ${{ steps.scan.outputs.medium || 0 }};

            const body = `## 🔒 Security Scan
            ${c > 0 || h > 0 ? '❌ **Issues Found**' : '✅ **Passed**'}

            | Level | Count |
            |-------|-------|
            | 🔴 Critical | ${c} |
            | 🟠 High | ${h} |
            | 🟡 Medium | ${m} |

            [📄 View Reports](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(c => c.body?.includes('🔒 Security Scan'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: ❌ Block if Critical
        if: steps.scan.outputs.critical > 0
        run: |
          echo "::error::Critical vulnerabilities found!"
          exit 1