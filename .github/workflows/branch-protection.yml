name: Branch Protection Setup

on:
  workflow_dispatch: # Manual trigger only

permissions:
  administration: write
  contents: read

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner

    steps:
      - name: Setup Main Branch Protection
        run: |
          echo "Setting up branch protection for main..."
          gh api repos/${{ github.repository }}/branches/main/protection \
            --method PUT \
            --input - <<EOF
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Staging Branch Protection
        run: |
          echo "Setting up branch protection for staging..."
          gh api repos/${{ github.repository }}/branches/staging/protection \
            --method PUT \
            --input - <<EOF
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Staging Branch if not exists
        run: |
          # Check if staging branch exists
          if ! gh api repos/${{ github.repository }}/branches/staging &>/dev/null; then
            echo "Creating staging branch from main..."
            MAIN_SHA=$(gh api repos/${{ github.repository }}/git/refs/heads/main --jq '.object.sha')
            gh api repos/${{ github.repository }}/git/refs \
              --method POST \
              --input - <<EOF
          {
            "ref": "refs/heads/staging",
            "sha": "$MAIN_SHA"
          }
          EOF
          else
            echo "Staging branch already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}