# CodeRabbit AI Configuration for React Native/Expo Project
version: "1.0"

# Project-specific settings
project:
  name: "superCours"
  type: "react-native"
  framework: "expo"

# Review configuration
review:
  # Enable AI-powered review
  enabled: true

  # Language and framework specific rules
  languages:
    - typescript
    - javascript
    - tsx
    - jsx

  # Focus areas for React Native
  focus_areas:
    - performance
    - security
    - accessibility
    - code_quality
    - best_practices
    - react_native_specific

  # Custom rules for React Native/Expo
  rules:
    # Performance rules
    - name: "avoid-inline-styles"
      description: "Prefer StyleSheet.create() over inline styles"
      severity: "warning"

    - name: "optimize-images"
      description: "Check for proper image optimization"
      severity: "info"

    - name: "memory-leaks"
      description: "Check for potential memory leaks in useEffect"
      severity: "error"

    # React Native specific
    - name: "platform-specific-code"
      description: "Review Platform.select() usage"
      severity: "info"

    - name: "native-dependencies"
      description: "Check for proper native dependency usage"
      severity: "warning"

    # Security
    - name: "sensitive-data"
      description: "Check for hardcoded secrets or sensitive data"
      severity: "error"

    - name: "expo-security"
      description: "Review Expo-specific security practices"
      severity: "warning"

# File patterns to include/exclude
files:
  include:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "app.json"
    - "expo.json"
    - "package.json"

  exclude:
    - "node_modules/**"
    - ".expo/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "*.test.*"
    - "*.spec.*"

# Comment settings
comments:
  # Style of comments
  style: "conversational"

  # Include code suggestions
  include_suggestions: true

  # Include explanations
  include_explanations: true

  # Maximum comments per PR
  max_comments: 20

  # Language for comments
  language: "french"

# Integrations
integrations:
  # ESLint integration
  eslint:
    enabled: true
    config_file: "eslint.config.js"

  # TypeScript integration
  typescript:
    enabled: true
    config_file: "tsconfig.json"
    strict_mode: true

# Notifications
notifications:
  # Notify on critical issues
  critical_issues: true

  # Summary comment
  summary: true

  # Inline comments
  inline_comments: true

# Learning mode (improves over time)
learning:
  enabled: true
  feedback_integration: true